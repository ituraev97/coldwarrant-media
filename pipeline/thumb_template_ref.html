<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Anton;src:url(../node_modules/@fontsource/anton/files/anton-latin-400-normal.woff2)}
@font-face{font-family:Oswald;font-weight:700;src:url(../node_modules/@fontsource/oswald/files/oswald-latin-700-normal.woff2)}
@font-face{font-family:Plex;font-weight:600;src:url(../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-600-normal.woff2)}
:root{--ink:#0A0A0B;--bone:#ECE7DC;--red:#D3212D;--amber:#E8A33D}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#222;display:flex;flex-direction:column;gap:30px;padding:30px}
.t{position:relative;width:1280px;height:720px;overflow:hidden;background:var(--ink);color:var(--bone)}
.ph{position:absolute;background-size:cover;background-repeat:no-repeat}
.anton{font-family:Anton;line-height:.86}
.stroke{-webkit-text-stroke:0;text-shadow:0 6px 0 rgba(0,0,0,.55),0 0 40px rgba(0,0,0,.6)}
.stamp{position:absolute;border:7px solid var(--red);color:var(--red);font-family:Plex;font-weight:600;letter-spacing:6px;padding:6px 16px;background:rgba(10,10,11,.55)}
.logo{position:absolute;display:flex;gap:10px;font-family:Anton;font-size:38px;align-items:center}
.logo i{font-style:normal;background:var(--red);padding:2px 10px 0}
.tag{display:inline-block;font-family:Anton;color:var(--ink);background:var(--amber);padding:8px 20px 4px}
.vig{position:absolute;inset:0;box-shadow:inset 0 0 180px rgba(0,0,0,.75)}
</style></head><body>

<!-- A: cuffs + MS-13 / BORN IN L.A. -->
<div class="t" id="A">
  <div class="ph" style="right:-120px;top:-40px;width:1000px;height:800px;background-image:url(cuffs_hi2.jpg);background-position:55% 18%;background-size:118%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#0A0A0B 0%,#0A0A0B 31%,rgba(10,10,11,.65) 44%,rgba(10,10,11,0) 58%)"></div>
  <div class="vig"></div>
  <div style="position:absolute;left:40px;top:58px">
    <div class="anton stroke" style="font-size:286px;letter-spacing:-4px">MS-<span style="color:var(--red)">13</span></div>
    <div class="tag" style="font-size:100px;margin-top:22px;transform:rotate(-2deg)">BORN IN L.A.</div>
  </div>
  <div class="logo" style="left:44px;bottom:36px"><span>COLD</span><i>WARRANT</i></div>
</div>

<!-- B: graffiti full-bleed, BORN IN L.A. -->
<div class="t" id="B">
  <div class="ph" style="inset:0;background-image:url(graffiti2_hi.jpg);background-position:30% 40%;background-size:118%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(0deg,rgba(10,10,11,.92) 0%,rgba(10,10,11,.2) 45%,rgba(10,10,11,0) 70%)"></div>
  <div class="vig"></div>
  <div style="position:absolute;left:44px;bottom:60px">
    <div class="tag" style="font-size:44px;background:var(--red);color:var(--bone);transform:rotate(-2deg)">MS-13</div>
    <div class="anton stroke" style="font-size:190px;margin-top:14px">BORN IN <span style="color:var(--amber)">L.A.</span></div>
  </div>
  <div class="stamp" style="right:40px;top:40px;font-size:28px;transform:rotate(6deg)">CASE FILE 001</div>
</div>

<!-- C: cuffs + question hook -->
<div class="t" id="C">
  <div class="ph" style="right:-120px;top:-40px;width:1000px;height:800px;background-image:url(cuffs_hi2.jpg);background-position:55% 18%;background-size:118%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,#0A0A0B 0%,#0A0A0B 36%,rgba(10,10,11,.65) 49%,rgba(10,10,11,0) 63%)"></div>
  <div class="vig"></div>
  <div style="position:absolute;left:40px;top:54px;width:600px">
    <div class="anton" style="font-size:84px;color:var(--amber)">FROM L.A. KIDS</div>
    <div class="anton stroke" style="font-size:176px;margin-top:8px">TO <span style="color:var(--red)">TERROR</span><br>LIST</div>
  </div>
  <div class="logo" style="left:44px;bottom:36px"><span>COLD</span><i>WARRANT</i></div>
</div>

<!-- D: raid night + MS-13 -->
<div class="t" id="D">
  <div class="ph" style="inset:0;background-image:url(raid_hi.jpg);background-position:60% 50%;background-size:125%"></div>
  <div style="position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,10,11,.92) 0%,rgba(10,10,11,.55) 40%,rgba(10,10,11,0) 65%)"></div>
  <div class="vig"></div>
  <div style="position:absolute;left:44px;top:90px">
    <div class="anton stroke" style="font-size:250px">MS-<span style="color:var(--red)">13</span></div>
    <div class="tag" style="font-size:78px;margin-top:20px;transform:rotate(-2deg)">THE CRACKDOWN</div>
  </div>
  <div class="stamp" style="right:44px;top:40px;font-size:28px;transform:rotate(6deg)">CASE FILE 001</div>
</div>
</body></html>
